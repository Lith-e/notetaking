<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SmartNotes - Complete Note-Taking Solution</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #800020;
            --primary-light: #a2324d;
            --primary-dark: #5a0017;
            --accent-color: #d4af37;
            --bg-color: #fef9f7;
            --text-color: #333333;
            --sidebar-bg: #f8f1ef;
            --border-color: #e8d4d0;
            --hover-color: #f2e4e1;
            --shadow: 0 4px 12px rgba(128, 0, 32, 0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }
        [data-theme="dark"] {
            --primary-color: #a2324d;
            --primary-light: #c2546b;
            --primary-dark: #5a0017;
            --accent-color: #e6c158;
            --bg-color: #1a0f14;
            --text-color: #f0e6e3;
            --sidebar-bg: #25161d;
            --border-color: #3d232d;
            --hover-color: #321b24;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: var(--transition);
            background-image: radial-gradient(circle at 15% 50%, rgba(128, 0, 32, 0.05) 0%, transparent 55%),
                              radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 55%);
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
            max-width: 1600px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .sidebar { width:340px; background-color:var(--sidebar-bg); border-right:1px solid var(--border-color); display:flex; flex-direction:column; overflow:hidden; transition:var(--transition); }
        .sidebar-header { padding:24px; border-bottom:1px solid var(--border-color); background:linear-gradient(135deg, var(--primary-color), var(--primary-dark)); color:white; }
        .sidebar-header h1 { font-size:1.8rem; margin-bottom:16px; display:flex; align-items:center; gap:12px; font-weight:700; }
        .sidebar-header h1 i { color:var(--accent-color); }
        .new-note-btn { width:100%; padding:14px; background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.3); border-radius:var(--radius); cursor:pointer; font-weight:600; transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:8px; backdrop-filter: blur(10px); }
        .search-box { padding:20px; border-bottom:1px solid var(--border-color); }
        .search-box input { width:100%; padding:12px 16px; border:1px solid var(--border-color); border-radius:30px; background-color:var(--bg-color); color:var(--text-color); font-size:14px; transition:var(--transition); }
        .folders-section { padding:20px; border-bottom:1px solid var(--border-color); }
        .folders-section h3 { font-size:0.9rem; text-transform:uppercase; color:var(--primary-color); margin-bottom:16px; letter-spacing:0.5px; display:flex; align-items:center; gap:8px; }
        .folders { display:flex; flex-direction:column; gap:6px; }
        .folder { padding:12px 16px; cursor:pointer; border-radius:var(--radius); transition:var(--transition); display:flex; align-items:center; gap:12px; font-weight:500; }
        .folder:hover { background-color:var(--hover-color); transform:translateX(5px); }
        .folder.active { background-color:var(--primary-color); color:white; box-shadow:var(--shadow); }
        .add-folder-btn { width:100%; padding:12px; border:1px dashed var(--border-color); background:none; color:var(--text-color); border-radius:var(--radius); cursor:pointer; margin-top:12px; transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:8px; }
        .notes-list { flex:1; overflow-y:auto; padding:20px; }
        .note-item { padding:16px; border-radius:var(--radius); cursor:pointer; margin-bottom:12px; border:1px solid transparent; transition:var(--transition); background-color:var(--bg-color); box-shadow:0 2px 5px rgba(0,0,0,0.03); position:relative; }
        .note-item:hover { background-color:var(--hover-color); border-color:var(--border-color); transform:translateY(-3px); box-shadow:var(--shadow); }
        .note-item.active { background-color:var(--primary-color); color:white; border-color:var(--primary-dark); box-shadow:var(--shadow); }
        .note-title { font-weight:600; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:8px; padding-right:30px; }
        .note-preview-text { font-size:0.85rem; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px; }
        .note-item.active .note-preview-text { color:rgba(255,255,255,0.8); }
        .note-meta { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:0.75rem; }
        .mini-tag { background-color:rgba(255,255,255,0.2); color:white; padding:3px 8px; border-radius:12px; font-size:0.7rem; }
        .note-item:not(.active) .mini-tag { background-color:var(--primary-light); color:white; }
        .delete-note-btn { position:absolute; top:12px; right:12px; background:none; border:none; color:rgba(0,0,0,0.3); cursor:pointer; padding:4px; border-radius:4px; transition:var(--transition); opacity:0; }
        .note-item:hover .delete-note-btn { opacity:1; }
        .note-item.active .delete-note-btn { color:rgba(255,255,255,0.6); }
        .tags-section { padding:20px; border-top:1px solid var(--border-color); }
        .github-section { padding:20px; border-top:1px solid var(--border-color); }
        .github-sync-btn { width:100%; padding:12px; background-color:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:var(--radius); cursor:pointer; transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:8px; font-weight:500; }

        .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .editor-header { padding:20px 30px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; background-color:var(--bg-color); }
        #noteTitle { font-size:2rem; font-weight:700; border:none; background:none; color:var(--text-color); width:60%; padding:8px 0; transition:var(--transition); }
        .actions { display:flex; gap:12px; }
        .actions button { padding:12px 18px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); border-radius:var(--radius); cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:8px; font-weight:500; }
        .editor-container { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .editor-toolbar { padding:16px 30px; border-bottom:1px solid var(--border-color); display:flex; gap:10px; background-color:var(--sidebar-bg); }
        .editor-toolbar button { padding:10px 14px; border:1px solid var(--border-color); background:var(--bg-color); color:var(--text-color); border-radius:8px; cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:6px; }
        .editor-toolbar button:hover { background-color:var(--hover-color); border-color:var(--primary-color); }
        .editor-toolbar button.active { background-color:var(--primary-color); color:white; border-color:var(--primary-dark); box-shadow:var(--shadow); }

        .editor-area { flex:1; display:flex; overflow:hidden; }
        #noteEditor {
            flex:1;
            padding:30px;
            font-family:'Segoe UI','Roboto',sans-serif;
            background-color:var(--bg-color);
            color:var(--text-color);
            resize:none;
            font-size:16px;
            line-height:1.7;
            border-right:1px solid var(--border-color);
            transition:var(--transition);
            overflow-y:auto;
            outline: none;
            caret-color: var(--text-color);
            min-height: 300px;
        }

        #noteEditor[contenteditable="true"] { white-space: pre-wrap; }
        #noteEditor[contenteditable="false"] { background: linear-gradient(transparent, transparent); }

        .task-item { display:flex; align-items:flex-start; margin-bottom:0.6rem; padding:0.25rem 0; border-radius:6px; transition:var(--transition); }
        .task-item .task-checkbox { margin-right:10px; margin-top:3px; cursor:pointer; width:18px; height:18px; border-radius:3px; border:2px solid var(--primary-color); background-color:transparent; position:relative; transition:var(--transition); }
        .task-item .task-checkbox:checked { background-color:var(--primary-color); }
        .task-item .task-text { flex:1; }
        .task-item .task-text.completed { text-decoration: line-through; color:#6b7280; }

        #noteEditor mark { background: #fff176; padding: 0 2px; border-radius: 2px; }

        .notification { position: fixed; top:20px; right:20px; background:var(--primary-color); color:white; padding:14px 24px; border-radius:var(--radius); z-index:1001; box-shadow:var(--shadow); transform: translateX(150%); transition: transform 0.4s ease; display:flex; align-items:center; gap:10px; }
        .notification.show { transform: translateX(0); }

        .welcome-message { text-align:center; padding:40px 20px; color:#6b7280; }
        .welcome-message i { font-size:3rem; color:var(--primary-light); margin-bottom:20px; }
        .no-notes { text-align:center; padding:3rem; color:#6b7280; }

        @media (max-width: 1200px) { .ai-panel { display:none; } }
        @media (max-width: 768px) {
            .app-container { flex-direction:column; }
            .sidebar { width:100%; height:40vh; }
            .editor-area { flex-direction:column; }
            #noteEditor { height:50vh; border-right:none; border-bottom:1px solid var(--border-color); }
        }

        .read-checkbox { width:18px; height:18px; margin-right:10px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-book"></i> SmartNotes</h1>
                <button class="new-note-btn" id="newNoteBtn">
                    <i class="fas fa-plus"></i> New Note
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes...">
            </div>

            <div class="folders-section">
                <h3><i class="fas fa-folder"></i> Folders</h3>
                <div class="folders">
                    <div class="folder active" data-folder="all">
                        <i class="fas fa-file-alt"></i> All Notes
                    </div>
                    <div class="folder" data-folder="personal">
                        <i class="fas fa-user"></i> Personal
                    </div>
                    <div class="folder" data-folder="work">
                        <i class="fas fa-briefcase"></i> Work
                    </div>
                    <div class="folder" data-folder="ideas">
                        <i class="fas fa-lightbulb"></i> Ideas
                    </div>
                </div>
                <button class="add-folder-btn" id="addFolderBtn">
                    <i class="fas fa-plus"></i> New Folder
                </button>
            </div>

            <div class="notes-list" id="notesList">
            </div>

            <div class="tags-section">
                <h3><i class="fas fa-tags"></i> Smart Tags</h3>
                <div class="tags-container" id="tagsContainer">
                    <div class="tag-placeholder">Write something to generate tags...</div>
                </div>
            </div>

            <div class="github-section">
                <button class="github-sync-btn" id="githubSyncBtn">
                    <i class="fab fa-github"></i> Connect GitHub
                </button>
                <div class="sync-status" id="syncStatus"></div>
                <div class="github-setup" id="githubSetup" style="display:none;">
                    <h4>GitHub Setup</h4>
                    <input type="text" id="githubRepo" placeholder="username/repository">
                    <input type="text" id="githubToken" placeholder="GitHub Token">
                    <button id="saveGithubConfig">Save Configuration</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="editor-header">
                <input type="text" id="noteTitle" placeholder="Note Title">
                <div class="actions">
                    <button id="shareBtn" title="Share Note">
                        <i class="fas fa-share-alt"></i> Share
                    </button>
                    <button id="exportBtn" title="Export Note">
                        <i class="fas fa-download"></i> Export
                    </button>
                    <button id="saveBtn" title="Save Note">
                        <i class="fas fa-save"></i> Save
                    </button>
                    <button id="deleteBtn" title="Delete Note" style="display:none;">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                    <button id="themeToggle" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>

            <div class="editor-container">
                <div class="editor-toolbar">
                    <button data-cmd="bold" title="Bold" id="btnBold"><i class="fas fa-bold"></i></button>
                    <button data-cmd="italic" title="Italic" id="btnItalic"><i class="fas fa-italic"></i></button>
                    <button data-cmd="strikeThrough" title="Strikethrough" id="btnStrike"><i class="fas fa-strikethrough"></i></button>
                    <button data-cmd="highlight" title="Highlight" id="btnHighlight"><i class="fas fa-highlighter"></i></button>
                    <button data-cmd="insertCheckbox" title="Insert Checklist Item" id="btnCheckbox"><i class="fas fa-check-square"></i></button>
                    <button data-cmd="blockquote" title="Quote" id="btnQuote"><i class="fas fa-quote-right"></i></button>
                </div>

                <div class="editor-area">
                    <div id="noteEditor" contenteditable="true" spellcheck="true" placeholder="Start writing your note here..."></div>
                </div>
            </div>
        </div>
    </div>

    <div id="shareModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3><i class="fas fa-share-alt"></i> Share Note</h3>
            <p>Share this note with others:</p>
            <div class="share-input-group">
                <input type="text" id="shareLink" readonly>
                <button id="copyLinkBtn">Copy</button>
            </div>
            <div class="share-options">
                <button class="share-option" data-platform="twitter"><i class="fab fa-twitter"></i> Twitter</button>
                <button class="share-option" data-platform="linkedin"><i class="fab fa-linkedin"></i> LinkedIn</button>
                <button class="share-option" data-platform="whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</button>
            </div>
        </div>
    </div>

    <div id="exportModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3><i class="fas fa-download"></i> Export Note</h3>
            <div class="export-options">
                <button class="export-option" data-format="markdown"><i class="fas fa-file-alt"></i> Markdown</button>
                <button class="export-option" data-format="html"><i class="fas fa-code"></i> HTML</button>
                <button class="export-option" data-format="pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="export-option" data-format="text"><i class="fas fa-file-text"></i> Plain Text</button>
            </div>
        </div>
    </div>

    <div id="folderModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3><i class="fas fa-folder-plus"></i> Create New Folder</h3>
            <input type="text" id="newFolderName" placeholder="Folder name">
            <div class="folder-colors">
                <div class="color-option" data-color="#800020" style="background-color:#800020;"></div>
                <div class="color-option" data-color="#5a0017" style="background-color:#5a0017;"></div>
                <div class="color-option" data-color="#a2324d" style="background-color:#a2324d;"></div>
            </div>
            <button id="createFolderBtn">Create Folder</button>
        </div>
    </div>

    <div id="deleteModal" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3><i class="fas fa-trash"></i> Delete Note</h3>
            <div class="delete-confirmation">
                <p>Are you sure you want to delete this note?</p>
                <p><strong id="noteToDeleteTitle"></strong></p>
                <div class="delete-actions">
                    <button class="delete-btn delete-confirm" id="confirmDelete">Delete</button>
                    <button class="delete-btn delete-cancel" id="cancelDelete">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        class SmartNotesApp {
            constructor() {
                this.notes = this.loadNotes();
                this.currentNote = null;
                this.currentFolder = 'all';
                this.isEditing = true;
                this.highlightActive = false;
                this.init();
            }

            init() {
                this.bindEvents();
                this.renderNotesList();
                this.applyTheme();
                this.updateDeleteButton();
                if (this.notes && this.notes.length > 0) {
                    this.currentNote = this.notes[0];
                    this.loadNoteIntoEditor(this.currentNote);
                }
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.toggleSaveEdit());
                document.getElementById('deleteBtn').addEventListener('click', () => this.showDeleteModal());
                document.getElementById('searchInput').addEventListener('input', (e) => this.searchNotes(e.target.value));
                document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());
                document.getElementById('shareBtn').addEventListener('click', () => this.shareNote());
                document.getElementById('exportBtn').addEventListener('click', () => this.showExportModal());
                document.getElementById('noteTitle').addEventListener('input', () => {
                    if (this.currentNote && this.isEditing) {
                        this.currentNote.title = document.getElementById('noteTitle').value;
                        this.saveToStorage(false);
                        this.renderNotesList();
                    }
                });

                document.querySelectorAll('.folder').forEach(folder => {
                    folder.addEventListener('click', (e) => {
                        const f = folder.dataset.folder;
                        this.selectFolder(f);
                    });
                });

                document.querySelectorAll('.editor-toolbar button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const cmd = btn.dataset.cmd;
                        this.handleToolbar(cmd, btn);
                    });
                });

                const editor = document.getElementById('noteEditor');
                editor.addEventListener('input', (e) => {
                    this.generateAITags(editor.innerText || editor.textContent);
                });

                this.setupModalEvents();

                document.querySelectorAll('.export-option').forEach(option => {
                    option.addEventListener('click', (e) => {
                        this.exportNote(e.currentTarget.dataset.format);
                    });
                });
            }

            setupModalEvents() {
                const shareModal = document.getElementById('shareModal');
                const exportModal = document.getElementById('exportModal');
                const folderModal = document.getElementById('folderModal');
                const deleteModal = document.getElementById('deleteModal');

                document.querySelectorAll('.close').forEach(closeBtn => {
                    closeBtn.addEventListener('click', () => {
                        shareModal.style.display = 'none';
                        exportModal.style.display = 'none';
                        folderModal.style.display = 'none';
                        deleteModal.style.display = 'none';
                    });
                });

                document.getElementById('copyLinkBtn').addEventListener('click', () => {
                    navigator.clipboard.writeText(document.getElementById('shareLink').value);
                    this.showNotification('Link copied to clipboard!');
                });

                document.querySelectorAll('.share-option').forEach(option => {
                    option.addEventListener('click', (e) => this.shareToPlatform(e.currentTarget.dataset.platform));
                });

                document.getElementById('addFolderBtn').addEventListener('click', () => {
                    folderModal.style.display = 'block';
                });

                document.getElementById('createFolderBtn').addEventListener('click', () => {
                    this.createNewFolder();
                });

                document.getElementById('confirmDelete').addEventListener('click', () => this.deleteNote());
                document.getElementById('cancelDelete').addEventListener('click', () => deleteModal.style.display = 'none');

                window.addEventListener('click', (e) => {
                    if (e.target === shareModal) shareModal.style.display = 'none';
                    if (e.target === exportModal) exportModal.style.display = 'none';
                    if (e.target === folderModal) folderModal.style.display = 'none';
                    if (e.target === deleteModal) deleteModal.style.display = 'none';
                });
            }

            loadNotes() {
                const saved = localStorage.getItem('smart-notes');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { return []; }
                } else {
                    return [
                        {
                            id: '1',
                            title: 'Welcome to SmartNotes!',
                            content: '<h1>Welcome to SmartNotes! 🚀</h1><p>This is your first note. Here are some features you can try:</p><h2>📝 Formatting</h2><ul><li>Use <strong>bold</strong> text for emphasis</li><li>Use <em>italic</em> text for subtle emphasis</li></ul><h2>✅ Task Management</h2><div class="task-item"><input class="task-checkbox" type="checkbox"><span class="task-text">Create your first note</span></div><div class="task-item"><input class="task-checkbox" type="checkbox" checked><span class="task-text completed">Explore the interface</span></div>',
                            folder: 'personal',
                            tags: ['welcome','features','guide'],
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        }
                    ];
                }
            }

            saveToStorage(showNotification = true) {
                localStorage.setItem('smart-notes', JSON.stringify(this.notes));
                if (showNotification) this.showNotification('Changes saved locally');
            }

            createNewNote() {
                const note = {
                    id: Date.now().toString(),
                    title: 'Untitled Note',
                    content: '',
                    folder: this.currentFolder === 'all' ? 'personal' : this.currentFolder,
                    tags: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                this.notes.unshift(note);
                this.currentNote = note;
                this.renderNotesList();
                this.loadNoteIntoEditor(note);
                this.saveToStorage(false);
                this.updateDeleteButton();
                setTimeout(() => document.getElementById('noteTitle').focus(), 100);
            }

            loadNoteIntoEditor(note) {
                this.currentNote = note;
                document.getElementById('noteTitle').value = note.title || '';
                const editor = document.getElementById('noteEditor');
                editor.innerHTML = note.content || '';
                this.setEditorMode(true);
                this.generateAITags(editor.innerText || editor.textContent);
                this.renderNotesList();
            }

            updateDeleteButton() {
                const deleteBtn = document.getElementById('deleteBtn');
                if (this.currentNote) deleteBtn.style.display = 'flex'; else deleteBtn.style.display = 'none';
            }

            toggleSaveEdit() {
                if (!this.currentNote) {
                    this.createNewNote();
                    return;
                }
                if (this.isEditing) {
                    this.saveNoteAndLock();
                } else {
                    this.setEditorMode(true);
                    this.isEditing = true;
                    const saveBtn = document.getElementById('saveBtn');
                    saveBtn.innerHTML = '<i class="fas fa-save"></i> Save';
                    this.showNotification('Edit mode enabled');
                }
            }

            saveNoteAndLock() {
                const editor = document.getElementById('noteEditor');
                this.currentNote.title = document.getElementById('noteTitle').value || 'Untitled Note';
                this.currentNote.content = editor.innerHTML;
                this.currentNote.updatedAt = new Date().toISOString();

                this.saveToStorage();
                this.setEditorMode(false);
                this.isEditing = false;

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.innerHTML = '<i class="fas fa-edit"></i> Edit';

                this.showNotification('Note saved (read-only). Click Edit to modify.');
                this.renderNotesList();
            }

            setEditorMode(editable) {
                const editor = document.getElementById('noteEditor');
                if (editable) {
                    editor.setAttribute('contenteditable', 'true');
                    editor.classList.remove('read-only');
                    editor.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.disabled = true;
                        cb.classList.add('task-checkbox');
                    });
                    editor.querySelectorAll('.task-text').forEach(span => {
                        span.setAttribute('contenteditable', 'true');
                    });
                    document.querySelectorAll('.editor-toolbar button').forEach(b => b.classList.remove('active'));
                } else {
                    editor.setAttribute('contenteditable', 'false');
                    editor.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        cb.disabled = false;
                        cb.classList.add('read-checkbox');
                        cb.addEventListener('change', (e) => {
                            const next = cb.nextElementSibling;
                            if (next && next.classList) {
                                next.classList.toggle('completed', cb.checked);
                            }
                            if (this.currentNote) {
                                this.currentNote.content = editor.innerHTML;
                                this.saveToStorage(false);
                            }
                        });
                    });
                    editor.querySelectorAll('.task-text').forEach(span => {
                        span.setAttribute('contenteditable', 'false');
                    });
                }
            }

            showDeleteModal() {
                if (!this.currentNote) return;
                this.noteToDelete = this.currentNote;
                document.getElementById('noteToDeleteTitle').textContent = this.currentNote.title;
                document.getElementById('deleteModal').style.display = 'block';
            }

            deleteNote() {
                if (!this.noteToDelete) return;
                this.notes = this.notes.filter(n => n.id !== this.noteToDelete.id);
                if (this.currentNote && this.currentNote.id === this.noteToDelete.id) {
                    this.currentNote = null;
                    document.getElementById('noteTitle').value = '';
                    document.getElementById('noteEditor').innerHTML = '';
                }
                this.saveToStorage();
                this.renderNotesList();
                document.getElementById('deleteModal').style.display = 'none';
                this.showNotification('Note deleted successfully');
                this.noteToDelete = null;
            }

            searchNotes(query) {
                if (!query.trim()) { this.renderNotesList(); return; }
                const filtered = this.notes.filter(note => 
                    (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                    (note.content && note.content.toLowerCase().includes(query.toLowerCase())) ||
                    (note.tags && note.tags.some(tag => tag.toLowerCase().includes(query.toLowerCase())))
                );
                this.renderNotesList(filtered);
            }

            renderNotesList(notes = null) {
                const notesList = document.getElementById('notesList');
                const notesToShow = notes || this.notes.filter(note => this.currentFolder === 'all' || note.folder === this.currentFolder);
                if (notesToShow.length === 0) {
                    notesList.innerHTML = `<div class="no-notes"><p>No notes found in this folder</p><button onclick="app.createNewNote()" style="margin-top:15px;padding:10px 20px;background:var(--primary-color);color:white;border:none;border-radius:var(--radius);cursor:pointer;">Create your first note</button></div>`;
                    return;
                }

                notesList.innerHTML = notesToShow.map(note => `
                    <div class="note-item ${this.currentNote?.id === note.id ? 'active' : ''}" data-id="${note.id}" onclick="app.selectNote('${note.id}')">
                        <div class="note-title"><i class="fas fa-sticky-note"></i> ${this.escapeHTML(note.title)}</div>
                        <div class="note-preview-text">${this.escapeHTML((note.content || '').replace(/<[^>]*>/g,'').substring(0,100))}${(note.content||'').length>100?'...':''}</div>
                        <div class="note-meta"><small>${new Date(note.updatedAt).toLocaleDateString()}</small>${note.tags && note.tags.length>0? `<div class="note-tags">${note.tags.slice(0,2).map(tag => `<span class="tag mini-tag">${tag}</span>`).join('')}</div>` : ''}</div>
                        <button class="delete-note-btn" onclick="app.deleteNoteFromList('${note.id}', event)"><i class="fas fa-times"></i></button>
                    </div>
                `).join('');
            }

            deleteNoteFromList(noteId, event) {
                event.stopPropagation();
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;
                this.noteToDelete = note;
                document.getElementById('noteToDeleteTitle').textContent = note.title;
                document.getElementById('deleteModal').style.display = 'block';
            }

            selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;
                this.currentNote = note;
                this.loadNoteIntoEditor(note);
            }

            selectFolder(folder) {
                this.currentFolder = folder;
                document.querySelectorAll('.folder').forEach(f => f.classList.remove('active'));
                const el = document.querySelector(`.folder[data-folder="${folder}"]`);
                if (el) el.classList.add('active');
                this.renderNotesList();
            }

            handleToolbar(cmd, btn) {
                const editor = document.getElementById('noteEditor');
                editor.focus();

                switch(cmd) {
                    case 'bold':
                        document.execCommand('bold');
                        btn.classList.toggle('active');
                        break;
                    case 'italic':
                        document.execCommand('italic');
                        btn.classList.toggle('active');
                        break;
                    case 'strikeThrough':
                        document.execCommand('strikeThrough');
                        btn.classList.toggle('active');
                        break;
                    case 'highlight':
                        if (!btn.classList.contains('active')) {
                            try {
                                const applied = document.execCommand('hiliteColor', false, 'yellow') || document.execCommand('backColor', false, 'yellow');
                                if (!applied) this.wrapSelectionWithTag('mark');
                            } catch(e) {
                                this.wrapSelectionWithTag('mark');
                            }
                            btn.classList.add('active');
                        } else {
                            btn.classList.remove('active');
                        }
                        break;
                    case 'insertCheckbox':
                        const range = window.getSelection().getRangeAt(0);
                        const wrapper = document.createElement('div');
                        wrapper.className = 'task-item';
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.disabled = true;
                        checkbox.className = 'task-checkbox';
                        const span = document.createElement('span');
                        span.className = 'task-text';
                        span.contentEditable = "true";
                        span.innerHTML = 'New task';
                        wrapper.appendChild(checkbox);
                        wrapper.appendChild(span);

                        range.deleteContents();
                        range.insertNode(wrapper);

                        const sel = window.getSelection();
                        sel.removeAllRanges();
                        const newRange = document.createRange();
                        newRange.selectNodeContents(span);
                        newRange.collapse(false);
                        sel.addRange(newRange);

                        break;
                    case 'blockquote':
                        document.execCommand('formatBlock', false, 'blockquote');
                        break;
                }
            }

            wrapSelectionWithTag(tagName = 'mark') {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                const range = sel.getRangeAt(0);
                if (range.collapsed) return;
                const wrapper = document.createElement(tagName);
                wrapper.appendChild(range.extractContents());
                range.insertNode(wrapper);
                sel.removeAllRanges();
                const r2 = document.createRange();
                r2.selectNodeContents(wrapper);
                sel.addRange(r2);
            }

            generateAITags(content) {
                if (!content || content.length < 10) {
                    document.getElementById('tagsContainer').innerHTML = '<div class="tag-placeholder">Write something to generate tags...</div>';
                    return;
                }
                const commonWords = ['the','and','is','in','to','a','that','it','with','for','as','was','on','are','this','but','not','they','have','has','had'];
                const words = content.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(w=>w.length>3 && !commonWords.includes(w));
                const wc = {};
                words.forEach(w => wc[w] = (wc[w] || 0) + 1);
                const tags = Object.entries(wc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]);
                this.updateAITags(tags);
            }

            updateAITags(tags) {
                const container = document.getElementById('tagsContainer');
                if (!tags || tags.length === 0) {
                    container.innerHTML = '<div class="tag-placeholder">Write something to generate tags...</div>';
                    return;
                }
                container.innerHTML = tags.map(t => `<span class="tag"><i class="fas fa-tag"></i> ${t}</span>`).join('');
            }

            shareNote() {
                if (!this.currentNote) { this.showNotification('Please create a note first!'); return; }
                const shareLink = `${window.location.origin}/share/${this.currentNote.id}`;
                document.getElementById('shareLink').value = shareLink;
                document.getElementById('shareModal').style.display = 'block';
            }

            shareToPlatform(platform) {
                const link = document.getElementById('shareLink').value;
                let url = '';
                switch(platform) {
                    case 'twitter': url = `https://twitter.com/intent/tweet?text=Check out this note&url=${encodeURIComponent(link)}`; break;
                    case 'linkedin': url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(link)}`; break;
                    case 'whatsapp': url = `https://wa.me/?text=Check out this note: ${encodeURIComponent(link)}`; break;
                }
                if (url) window.open(url, '_blank');
            }

            showExportModal() {
                if (!this.currentNote) { this.showNotification('Please create a note first!'); return; }
                document.getElementById('exportModal').style.display = 'block';
            }

            exportNote(format) {
                if (!this.currentNote) return;
                const content = this.currentNote.content || '';
                const title = this.currentNote.title || 'note';
                let blob, filename;
                switch(format) {
                    case 'markdown':
                        const md = this.htmlToPlainText(content);
                        blob = new Blob([md], { type: 'text/markdown' });
                        filename = `${title}.md`;
                        break;
                    case 'html':
                        const html = `<!doctype html><html><head><meta charset="utf-8"><title>${this.escapeHTML(title)}</title></head><body>${content}</body></html>`;
                        blob = new Blob([html], { type: 'text/html' });
                        filename = `${title}.html`;
                        break;
                    case 'text':
                        blob = new Blob([this.htmlToPlainText(content)], { type: 'text/plain' });
                        filename = `${title}.txt`;
                        break;
                    case 'pdf':
                        this.showNotification('PDF export requires additional libraries. Use HTML or Markdown.');
                        return;
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename; document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
                document.getElementById('exportModal').style.display = 'none';
                this.showNotification(`Exported as ${format.toUpperCase()}!`);
            }

            htmlToPlainText(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.innerText || tmp.textContent || '';
            }

            createNewFolder() {
                const input = document.getElementById('newFolderName');
                const folderName = input.value.trim();
                if (!folderName) { this.showNotification('Please enter a folder name'); return; }
                this.showNotification(`Folder "${folderName}" created!`);
                document.getElementById('folderModal').style.display = 'none';
                input.value = '';
            }

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                const themeIcon = document.querySelector('#themeToggle i');
                themeIcon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }

            applyTheme() {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                const themeIcon = document.querySelector('#themeToggle i');
                themeIcon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }

            showNotification(message) {
                const n = document.getElementById('notification');
                n.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
                n.classList.add('show');
                setTimeout(()=> n.classList.remove('show'), 3000);
            }

            escapeHTML(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new SmartNotesApp();
        });

        window.app = {
            selectNote: function(id) { if (app) app.selectNote(id); },
            deleteNoteFromList: function(noteId, event) { if (app) app.deleteNoteFromList(noteId, event); },
            createNewNote: function() { if (app) app.createNewNote(); },
        };
    </script>
</body>
</html>
